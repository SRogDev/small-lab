[project]
name = "small-lab"
version = "0.1.0"
description = "Independent, long-term machine-learning research laboratory: understand neural models by building them from first principles."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "SRogDev" },
]
dependencies = [
    "torch",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.9",
]

[tool.uv.sources]
# Default to the CPU wheel of PyTorch: the lab assumes no local CUDA GPU
# (see README "Compute expectations"). GPU users install a CUDA build
# explicitly; see README "GPU environments".
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/small_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
